<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Oficina Smart v17.8 - Versão Definitiva</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* DESIGN E IDENTIDADE VISUAL PRESERVADOS */
body { font-family: 'Segoe UI', sans-serif; background:#0f1720; color:#e6eef6; margin:0; padding:15px; }
.container { max-width:1100px; margin:0 auto; }
h1 { text-align:center; color: #2b9cff; margin-bottom: 20px; font-size: 22px; }
.card { background:#14212d; padding:20px; border-radius:12px; margin-bottom:15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.tab-container { display: flex; border-bottom: 2px solid #2a3a4d; margin-bottom: 15px; gap: 5px; }
.tab-button { background: #14212d; color: #98a3b3; border: none; padding: 10px 20px; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: bold; flex: 1; }
.tab-button.active { background: #2b9cff; color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }
label { display:block; margin-top:10px; font-weight: 600; color: #a0aec0; font-size: 14px; }
input, select { width:100%; padding:12px; border-radius:6px; border:1px solid #2a3a4d; background:#0d1a24; color:#fff; box-sizing: border-box; margin-top: 5px; font-size: 16px; }
.row { display:flex; gap:10px; flex-wrap: wrap; }
.row > * { flex:1; min-width: 140px; }
button { padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight: bold; transition: 0.2s; }
.btn-main { background:#2b9cff; color: white; width: 100%; margin-top: 15px; font-size: 16px; }
.btn-scan { background: #8b5cf6; color: white; margin-bottom: 15px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #a78bfa; height: 55px; cursor: pointer; }
.btn-blue { background:#2563eb; color: white; }
.btn-sync { background:#16a34a; color: white; }
.btn-yellow { background: #eab308; color: #000; }
.btn-red { background: #dc2626; color: white; }
table { width:100%; border-collapse:collapse; margin-top:10px; background: #0d1a24; font-size: 13px; }
th, td { padding:10px; border-bottom: 1px solid #2a3a4d; text-align: left; }
th { background:#1c2b38; color: #2b9cff; text-transform: uppercase; font-size: 10px; }
.stat-box { background:#0d1a24; padding:10px; border-radius:8px; text-align: center; border: 1px solid #2a3a4d; flex: 1; }
.stat-val { font-size: 1.4em; font-weight: bold; color: #4ade80; }
.status-pill { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.loading-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; }
.spinner { border: 4px solid #f3f3f3; border-top: 4px solid #8b5cf6; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>

<body>
<div id="loader" class="loading-overlay">
    <div class="spinner"></div>
    <p style="margin-top:15px; color:#a78bfa; font-weight:bold;">IA PROCESSANDO DADOS...</p>
</div>

<div class="container">
  <h1>Oficina Smart v17.8</h1>

  <div class="card">
    <label>Técnico Responsável</label>
    <input id="usuario_nome" placeholder="Seu nome completo">
  </div>

  <div class="tab-container">
    <button class="tab-button active" onclick="openTab('tab-entrada', this)">📝 Lançamento</button>
    <button class="tab-button" onclick="openTab('tab-inventario', this)">📋 Lista & Nuvem</button>
  </div>

  <div id="tab-entrada" class="tab-content active">
    <div class="card">
      <label class="btn-scan">
        ✨ SCANNER IA (PROTEGIDO)
        <input type="file" accept="image/*" capture="camera" hidden onchange="processarComIA(event)">
      </label>

      <div class="row">
        <div><label>OM</label><input id="om" type="number"></div>
        <div><label>Patrimônio</label><input id="patrimonio"></div>
      </div>
      
      <label>Equipamento</label>
      <select id="nome" onchange="autoPreencher()"><option value="">Aguardando scanner...</option></select>

      <div class="row">
        <div><label>Horas</label><input id="horas" type="number" step="0.01"></div>
        <div><label>Valor Unit.</label><input id="valor" type="number" step="0.01"></div>
      </div>
      <button class="btn-main" onclick="addItem()">SALVAR ITEM</button>
    </div>
  </div>

  <div id="tab-inventario" class="tab-content">
    <div class="card">
      <div class="row" style="margin-bottom:15px;">
        <div class="stat-box"><div>Horas</div><div id="totalHoras" class="stat-val">0.00</div></div>
        <div class="stat-box"><div>Total</div><div id="totalValor" class="stat-val">R$ 0,00</div></div>
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;">
        <button onclick="generatePDF()" class="btn-blue" style="flex:1">PDF</button>
        <button onclick="generateExcel()" style="background:#16a34a; color:white; flex:1">Excel</button>
        <label class="btn-yellow" style="flex:1; margin:0; display:flex; align-items:center; justify-content:center; cursor:pointer;">
            Importar <input type="file" accept=".xlsx, .xls, .csv" hidden onchange="importExcel(event)">
        </label>
        <button onclick="syncData()" class="btn-sync" style="flex:2; background:#8b5cf6;">☁️ Sincronizar Nuvem</button>
      </div>

      <button onclick="clearAll()" class="btn-red" style="width:100%; margin-bottom:15px; font-size:12px;">Limpar Lista Local</button>
      
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Status</th><th>OM</th><th>Item</th><th>Total R$</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/* SEGURANÇA MASCARADA (Base64) */
const _0xd = ["QUl6YVN5QUNlV2pCTWVVT0pnOHJVQWY2MzFGbkE2ZEdGMGZ1MVk0", "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3MWdGOTNReUZIZ005dU11RTJObVhZZ3ZRMTkzTmY0SHZNMXVTTEdNQm96YWIyUW1GbG93TjNvQ1p2am1HN1lvTGYvZXhlYw==", "T0ZJQ0lOQS1TRUdVUkEtMTIz"];
const API_KEY_GEMINI = atob(_0xd[0]);
const GOOGLE_SCRIPT_URL = atob(_0xd[1]);
const TOKEN = atob(_0xd[2]);

/* TABELA DE PREÇOS COMPLETA */
const tabelaPrecos = [
  { nome: "ACABADORA DE SUPERFICIE", valor: 2.00, horas: 5.0 },
  { nome: "BALANCIM CADEIRINHA", valor: 2.00, horas: 2.25 },
  { nome: "BANCADA DE SERRA", valor: 8.00, horas: 4.5 },
  { nome: "BETONEIRA 150 LT", valor: 6.00, horas: 4.5 },
  { nome: "BETONEIRA 400 LT", valor: 6.00, horas: 4.5 },
  { nome: "BETONEIRA 600 LT", valor: 16.90, horas: 16.0 },
  { nome: "BOMBA MANGOTE", valor: 4.00, horas: 3.0 },
  { nome: "BOMBA SUBMERSA", valor: 4.00, horas: 4.0 },
  { nome: "COMPACTADOR", valor: 3.00, horas: 4.0 },
  { nome: "CORTADORA", valor: 3.00, horas: 4.0 },
  { nome: "GERADOR", valor: 3.00, horas: 3.2 },
  { nome: "GUINCHO DE ELEVAÇÃO", valor: 10.00, horas: 6.0 },
  { nome: "MARTELO 2 KG - 220V", valor: 1.50, horas: 2.0 },
  { nome: "MARTELO 5,7 KG - 220V", valor: 1.50, horas: 2.0 },
  { nome: "MARTELO 6 KG - 220V", valor: 1.70, horas: 2.0 },
  { nome: "MARTELO 11 KG - ROT", valor: 2.00, horas: 2.2 },
  { nome: "MARTELO 11 KG - 220V", valor: 1.70, horas: 2.2 },
  { nome: "MARTELO 16/19 KG", valor: 2.00, horas: 2.3 },
  { nome: "MARTELO 19 KG - 220V", valor: 2.00, horas: 2.5 },
  { nome: "MARTELO 30 KG - 220V", valor: 2.00, horas: 2.5 },
  { nome: "MINI GRUA", valor: 10.00, horas: 6.0 },
  { nome: "MOTOR - ACIONADOR", valor: 3.00, horas: 3.0 },
  { nome: "MOTOR - ELET TRIFA", valor: 3.00, horas: 3.0 },
  { nome: "PLACA VIBRATORIA", valor: 3.50, horas: 4.5 },
  { nome: "RÉGUA VIBRATÓRIA", valor: 5.00, horas: 4.5 },
  { nome: "TORRE DE ILUMINAÇÃO", valor: 25.00, horas: 6.0 },
  { nome: "UNIDADE HIDRÁULICA", valor: 8.00, horas: 16.0 },
  { nome: "VIBRADOR DE IMERSÃO", valor: 2.80, horas: 4.0 },
  { nome: "ROLO COMPACTADOR (Pesada)", valor: 20.00, horas: 24.0 },
  { nome: "MINI CARREGADEIRA (Pesada)", valor: 34.00, horas: 16.0 },
  { nome: "MINI ESCAVADEIRA (Pesada)", valor: 34.00, horas: 16.0 },
  { nome: "VELOX", valor: 8.00, horas: 6.0 },
  { nome: "PERFURATRIZ", valor: 25.00, horas: 6.0 }
];

let inventoryData = JSON.parse(localStorage.getItem("oficina_inventory")) || [];

/* FUNÇÕES DE IA */
async function processarComIA(event) {
    const file = event.target.files[0];
    if (!file) return;
    document.getElementById('loader').style.display = 'flex';
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async () => {
        const b64 = reader.result.split(',')[1];
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY_GEMINI}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Extraia OM, Patrimonio e Maquina. Resposta JSON puro." }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }] })
            });
            const d = await r.json();
            const js = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json|```/gi, "").trim());
            document.getElementById('om').value = js.om || "";
            document.getElementById('patrimonio').value = js.patrimonio || "";
            if(js.maquina) { document.getElementById('nome').value = js.maquina; autoPreencher(); }
        } catch (e) { alert("IA ocupada ou imagem não identificada."); }
        finally { document.getElementById('loader').style.display = 'none'; }
    };
}

/* LÓGICA DE LANÇAMENTO */
function autoPreencher() {
    const i = tabelaPrecos.find(x => x.nome === document.getElementById("nome").value);
    if (i) { document.getElementById("horas").value = i.horas; document.getElementById("valor").value = i.valor.toFixed(2); }
}

function addItem() {
    const it = {
        id: Date.now(), data: new Date().toLocaleDateString('pt-BR'),
        tecnico: document.getElementById("usuario_nome").value || "Geral",
        om: document.getElementById("om").value, patrimonio: document.getElementById("patrimonio").value,
        nome: document.getElementById("nome").value, horas: Number(document.getElementById("horas").value),
        valor: Number(document.getElementById("valor").value), sincronizado: false
    };
    if(!it.om || !it.nome) return alert("OM e Máquina obrigatórios!");
    inventoryData.unshift(it);
    localStorage.setItem("oficina_inventory", JSON.stringify(inventoryData));
    load();
    alert("Salvo!");
}

/* FUNÇÃO DE SINCRONIZAÇÃO COMPLETA */
async function syncData() {
    if(!navigator.onLine) return alert("Sem internet!");
    const tecnico = document.getElementById("usuario_nome").value;
    if(!tecnico) return alert("Nome do Técnico é obrigatório para sincronizar.");

    const pendentes = inventoryData.filter(i => !i.sincronizado);
    if(pendentes.length === 0) return alert("Nada novo para sincronizar.");

    document.getElementById('loader').style.display = 'flex';
    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, usuario: tecnico, itens: pendentes })
        });
        inventoryData.forEach(i => i.sincronizado = true);
        localStorage.setItem("oficina_inventory", JSON.stringify(inventoryData));
        load();
        alert("Sincronizado com a Nuvem!");
    } catch (e) { alert("Erro ao sincronizar."); }
    finally { document.getElementById('loader').style.display = 'none'; }
}

/* FUNÇÕES DE EXPORTAÇÃO E CARGA */
function load() {
    const b = document.getElementById("lista");
    b.innerHTML = "";
    let th = 0, tv = 0;
    inventoryData.forEach(i => {
        th += i.horas; tv += (i.horas * i.valor);
        b.innerHTML += `<tr>
            <td><span class="status-pill" style="background:${i.sincronizado ? '#4ade80' : '#dc2626'}"></span></td>
            <td>${i.om}</td><td>${i.nome}</td><td>R$ ${(i.horas*i.valor).toFixed(2)}</td>
        </tr>`;
    });
    document.getElementById("totalHoras").innerText = th.toFixed(2);
    document.getElementById("totalValor").innerText = "R$ " + tv.toLocaleString('pt-BR', {minimumFractionDigits: 2});
}

function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Relatório Oficina Smart", 14, 15);
    doc.autoTable({
        head: [['OM', 'Item', 'Horas', 'Total R$']],
        body: inventoryData.map(i => [i.om, i.nome, i.horas, (i.horas*i.valor).toFixed(2)]),
        startY: 20
    });
    doc.save("relatorio.pdf");
}

function generateExcel() {
    const ws = XLSX.utils.json_to_sheet(inventoryData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Dados");
    XLSX.writeFile(wb, "dados_oficina.xlsx");
}

function importExcel(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        const novos = json.map(row => ({
            id: Date.now() + Math.random(), data: new Date().toLocaleDateString('pt-BR'),
            tecnico: "Importado", om: row.OM || row.om, patrimonio: row.Patrimonio || row.patrimonio,
            nome: row.Item || row.nome, horas: Number(row.Horas || row.horas || 0),
            valor: Number(row.Valor || row.valor || 0), sincronizado: false
        })).filter(i => i.om);
        inventoryData = [...novos, ...inventoryData];
        localStorage.setItem("oficina_inventory", JSON.stringify(inventoryData));
        load();
    };
    reader.readAsArrayBuffer(file);
}

function clearAll() {
    if(confirm("Deseja apagar a lista local? Isso não apaga os dados já sincronizados na nuvem.")) {
        inventoryData = [];
        localStorage.setItem("oficina_inventory", JSON.stringify(inventoryData));
        load();
    }
}

function openTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
}

// Inicializa o Select
const sel = document.getElementById("nome");
tabelaPrecos.forEach(i => sel.innerHTML += `<option value="${i.nome}">${i.nome}</option>`);
load();
</script>
</body>
</html>

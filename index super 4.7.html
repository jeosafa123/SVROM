<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Oficina Smart - v15.7 AI Vision</title>

<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3062/3062409.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* DESIGN v15 PRO PRESERVADO */
body { font-family: 'Segoe UI', sans-serif; background:#0f1720; color:#e6eef6; margin:0; padding:15px; }
.container { max-width:1100px; margin:0 auto; }
h1 { text-align:center; color: #2b9cff; margin-bottom: 20px; font-size: 22px; }
.card { background:#14212d; padding:20px; border-radius:12px; margin-bottom:15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.tab-container { display: flex; border-bottom: 2px solid #2a3a4d; margin-bottom: 15px; gap: 5px; }
.tab-button { background: #14212d; color: #98a3b3; border: none; padding: 10px 20px; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: bold; flex: 1; }
.tab-button.active { background: #2b9cff; color: white; }
.tab-content { display: none; }
.tab-content.active { display: block; }
label { display:block; margin-top:10px; font-weight: 600; color: #a0aec0; font-size: 14px; }
input, select { width:100%; padding:12px; border-radius:6px; border:1px solid #2a3a4d; background:#0d1a24; color:#fff; box-sizing: border-box; margin-top: 5px; font-size: 16px; }
.row { display:flex; gap:10px; flex-wrap: wrap; }
.row > * { flex:1; min-width: 140px; }
button { padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight: bold; transition: 0.2s; }
.btn-main { background:#2b9cff; color: white; width: 100%; margin-top: 15px; font-size: 16px; }
.btn-scan { background: #8b5cf6; color: white; margin-bottom: 15px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #a78bfa; height: 55px; cursor: pointer; }
.btn-red { background:#dc2626; color: white; }
.btn-blue { background:#2563eb; color: white; }
.btn-sync { background:#16a34a; color: white; }
table { width:100%; border-collapse:collapse; margin-top:10px; background: #0d1a24; font-size: 13px; }
th, td { padding:10px; border-bottom: 1px solid #2a3a4d; text-align: left; }
th { background:#1c2b38; color: #2b9cff; text-transform: uppercase; font-size: 10px; }
.stat-box { background:#0d1a24; padding:10px; border-radius:8px; text-align: center; border: 1px solid #2a3a4d; flex: 1; }
.stat-val { font-size: 1.4em; font-weight: bold; color: #4ade80; }
.recent-item { font-size: 12px; padding: 8px; border-bottom: 1px solid #2a3a4d; display: flex; justify-content: space-between; }
.status-pill { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.loading-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center; }
.spinner { border: 4px solid #f3f3f3; border-top: 4px solid #8b5cf6; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>

<body>
<div id="loader" class="loading-overlay">
    <div class="spinner"></div>
    <p id="status-ocr" style="margin-top:15px; color:#a78bfa; font-weight:bold;">GEMINI AI ANALISANDO...</p>
</div>

<div class="container">
  <h1>Oficina Smart v15.7 AI</h1>

  <div class="card" style="border-left: 5px solid #8b5cf6;">
    <label style="margin-top:0">Técnico Responsável</label>
    <input id="usuario_nome" placeholder="Seu nome completo">
  </div>

  <div class="tab-container">
    <button class="tab-button active" onclick="openTab('tab-entrada', this)">📝 Lançamento AI</button>
    <button class="tab-button" onclick="openTab('tab-inventario', this)">📋 Lista & Nuvem</button>
  </div>

  <div id="tab-entrada" class="tab-content active">
    <div class="card">
      <label class="btn-scan">
        ✨ SCANNER GEMINI IA (ULTRA PRECISO)
        <input type="file" accept="image/*" capture="camera" hidden onchange="processarComIA(event)">
      </label>

      <div class="row">
        <div><label>OM</label><input id="om" type="number"></div>
        <div><label>Patrimônio</label><input id="patrimonio"></div>
      </div>
      
      <label>Equipamento</label>
      <select id="nome" onchange="autoPreencher()">
        <option value="">Aguardando scanner...</option>
      </select>

      <div class="row">
        <div><label>Horas</label><input id="horas" type="number" step="0.01"></div>
        <div><label>Valor Unit.</label><input id="valor" type="number" step="0.01"></div>
      </div>
      <button class="btn-main" onclick="addItem()">SALVAR ITEM</button>
    </div>

    <div class="card" id="cardRecentes" style="display:none;">
      <h3 style="font-size:14px; color:#8b5cf6; margin-top:0;">Últimos Lançamentos</h3>
      <div id="listaRecentes"></div>
    </div>
  </div>

  <div id="tab-inventario" class="tab-content">
    <div class="card">
      <div class="row" style="margin-bottom:15px;">
        <div class="stat-box"><div style="color:#98a3b3; font-size:12px;">Total Horas</div><div id="totalHoras" class="stat-val">0.00</div></div>
        <div class="stat-box"><div style="color:#98a3b3; font-size:12px;">Total R$</div><div id="totalValor" class="stat-val">R$ 0,00</div></div>
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;">
        <button onclick="generatePDF()" class="btn-blue" style="flex:1">PDF</button>
        <button onclick="generateExcel()" style="background:#16a34a; color:white; flex:1">Excel</button>
        <button onclick="syncData()" class="btn-sync" style="flex:2">☁️ Sincronizar</button>
      </div>
      
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" onclick="toggleAll(this)"></th>
              <th>Status</th><th>OM</th><th>Item</th><th>Total R$</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
      <button onclick="deleteSelected()" class="btn-red" style="margin-top:20px; width:100%">Excluir Selecionados</button>
    </div>
  </div>
</div>

<script>
/* DADOS PRESERVADOS */
const API_KEY_GEMINI = "AIzaSyArYzpxx9oFDd6bISyoI02seFlNc-ZQHjI"; 
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1gF93QyFH9mYuE2Nm3XYgdvQ19JNfR5HvM9uSLmGBzab2QmFlowN3oCZvjmG7YoLf/exec";
const TOKEN = "OFICINA-SEGURA-123";

const tabelaPrecos = [
  { nome: "ACABADORA DE SUPERFICIE", valor: 2.00, horas: 5.0 },
  { nome: "BALANCIM CADEIRINHA", valor: 2.00, horas: 2.25 },
  { nome: "BANCADA DE SERRA", valor: 8.00, horas: 4.5 },
  { nome: "BETONEIRA 150 LT", valor: 6.00, horas: 4.5 },
  { nome: "BETONEIRA 400 LT", valor: 6.00, horas: 4.5 },
  { nome: "BETONEIRA 600 LT", valor: 16.90, horas: 16.0 },
  { nome: "BOMBA MANGOTE", valor: 4.00, horas: 3.0 },
  { nome: "BOMBA SUBMERSA", valor: 4.00, horas: 4.0 },
  { nome: "COMPACTADOR", valor: 3.00, horas: 4.0 },
  { nome: "CORTADORA", valor: 3.00, horas: 4.0 },
  { nome: "GERADOR", valor: 3.00, horas: 3.2 },
  { nome: "GUINCHO DE ELEVAÇÃO", valor: 10.00, horas: 6.0 },
  { nome: "MARTELO 2 KG - 220V", valor: 1.50, horas: 2.0 },
  { nome: "MARTELO 5,7 KG - 220V", valor: 1.50, horas: 2.0 },
  { nome: "MARTELO 6 KG - 220V", valor: 1.70, horas: 2.0 },
  { nome: "MARTELO 11 KG - ROT", valor: 2.00, horas: 2.2 },
  { nome: "MARTELO 11 KG - 220V", valor: 1.70, horas: 2.2 },
  { nome: "MARTELO 16/19 KG", valor: 2.00, horas: 2.3 },
  { nome: "MARTELO 19 KG - 220V", valor: 2.00, horas: 2.5 },
  { nome: "MARTELO 30 KG - 220V", valor: 2.00, horas: 2.5 },
  { nome: "MINI GRUA", valor: 10.00, horas: 6.0 },
  { nome: "MOTOR - ACIONADOR", valor: 3.00, horas: 3.0 },
  { nome: "MOTOR - ELET TRIFA", valor: 3.00, horas: 3.0 },
  { nome: "PLACA VIBRATORIA", valor: 3.50, horas: 4.5 },
  { nome: "RÉGUA VIBRATÓRIA", valor: 5.00, horas: 4.5 },
  { nome: "TORRE DE ILUMINAÇÃO", valor: 25.00, horas: 6.0 },
  { nome: "UNIDADE HIDRÁULICA", valor: 8.00, horas: 16.0 },
  { nome: "VIBRADOR DE IMERSÃO", valor: 2.80, horas: 4.0 },
  { nome: "ROLO COMPACTADOR (Pesada)", valor: 20.00, horas: 24.0 },
  { nome: "MINI CARREGADEIRA (Pesada)", valor: 34.00, horas: 16.0 },
  { nome: "MINI ESCAVADEIRA (Pesada)", valor: 34.00, horas: 16.0 },
  { nome: "VELOX", valor: 8.00, horas: 6.0 },
  { nome: "PERFURATRIZ", valor: 25.00, horas: 6.0 }
];

let inventoryData = JSON.parse(localStorage.getItem("oficina_inventory")) || [];

// --- MOTOR DE IA GEMINI (NOVO) ---
async function processarComIA(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    document.getElementById('loader').style.display = 'flex';
    
    // Converter imagem para Base64
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY_GEMINI}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Aja como um assistente de oficina. Identifique na imagem: 1. O número da OM (Ordem de Manutenção). 2. O número do Patrimônio. 3. Qual dessas máquinas da lista é a correta: " + tabelaPrecos.map(m => m.nome).join(", ") + ". Retorne apenas um JSON assim: {\"om\":\"\", \"patrimonio\":\"\", \"maquina\":\"\"}" },
                            { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            const cleanJson = JSON.parse(rawText.replace(/```json|```/g, ""));

            if(cleanJson.om) document.getElementById('om').value = cleanJson.om;
            if(cleanJson.patrimonio) document.getElementById('patrimonio').value = cleanJson.patrimonio;
            if(cleanJson.maquina) {
                document.getElementById('nome').value = cleanJson.maquina;
                autoPreencher();
            }
        } catch (e) {
            console.error(e);
            alert("Erro na IA. Verifique sua chave ou conexão.");
        }
        document.getElementById('loader').style.display = 'none';
    };
}

/* FUNÇÕES DE LOGICA PRESERVADAS */
function autoPreencher() {
    const item = tabelaPrecos.find(i => i.nome === document.getElementById("nome").value);
    if (item) { 
        document.getElementById("horas").value = item.horas; 
        document.getElementById("valor").value = item.valor.toFixed(2); 
    }
}

function addItem() {
    const item = {
        id: "ID-" + Date.now(),
        data: new Date().toLocaleDateString('pt-BR'),
        tecnico: document.getElementById("usuario_nome").value || "Geral",
        om: document.getElementById("om").value,
        patrimonio: document.getElementById("patrimonio").value,
        nome: document.getElementById("nome").value,
        horas: Number(document.getElementById("horas").value) || 0,
        valor: Number(document.getElementById("valor").value) || 0,
        sincronizado: false
    };
    if (!item.om || !item.nome) return alert("OM e Máquina obrigatórios!");
    inventoryData.unshift(item);
    localStorage.setItem("oficina_inventory", JSON.stringify(inventoryData));
    load();
    updateRecentes();
}

function load() {
    const tbody = document.getElementById("lista");
    tbody.innerHTML = "";
    let th = 0, tv = 0;
    inventoryData.forEach((i, idx) => {
        const h = i.horas; const v = i.valor;
        th += h; tv += (h * v);
        const statusColor = i.sincronizado ? "#4ade80" : "#dc2626";
        tbody.innerHTML += `<tr>
            <td><input type="checkbox" class="row-select" data-index="${idx}"></td>
            <td><span class="status-pill" style="background:${statusColor}"></span></td>
            <td>${i.om}</td><td>${i.nome}</td><td>R$ ${(h*v).toFixed(2)}</td>
        </tr>`;
    });
    document.getElementById("totalHoras").innerText = th.toFixed(2);
    document.getElementById("totalValor").innerText = "R$ " + tv.toLocaleString('pt-BR', {minimumFractionDigits: 2});
}

function updateRecentes() {
    const lista = document.getElementById("listaRecentes");
    const ultimos = inventoryData.slice(0, 3);
    if(ultimos.length > 0) {
        document.getElementById("cardRecentes").style.display = "block";
        lista.innerHTML = ultimos.map(i => `
            <div class="recent-item">
                <span><b>${i.om}</b> - ${i.nome}</span>
                <span style="color:#4ade80">R$ ${(i.horas * i.valor).toFixed(2)}</span>
            </div>
        `).join("");
    }
}

async function syncData() {
    const tecnico = document.getElementById("usuario_nome").value;
    if(!tecnico) return alert("Digite seu nome!");
    document.getElementById('loader').style.display = 'flex';
    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST", mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, usuario: tecnico, itens: inventoryData })
        });
        inventoryData.forEach(i => i.sincronizado = true);
        localStorage.setItem("oficina_inventory", JSON.stringify(inventoryData));
        load();
        alert("Sincronizado com Sucesso!");
    } catch (e) { alert("Erro de conexão."); }
    document.getElementById('loader').style.display = 'none';
}

function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const tecnico = document.getElementById("usuario_nome").value || "Geral";
    doc.text(`Relatório Oficina - ${tecnico}`, 14, 15);
    const rows = inventoryData.map(i => [i.om, i.nome, i.horas, (i.horas*i.valor).toFixed(2)]);
    doc.autoTable({ head: [['OM', 'Item', 'Horas', 'R$']], body: rows, startY: 20 });
    doc.save(`Oficina_${tecnico}.pdf`);
}

function generateExcel() {
    const ws = XLSX.utils.json_to_sheet(inventoryData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Dados");
    XLSX.writeFile(wb, "oficina_pro.xlsx");
}

function openTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
}

function deleteSelected() {
    const checks = document.querySelectorAll(".row-select:checked");
    if (!checks.length || !confirm("Remover selecionados?")) return;
    const idxs = Array.from(checks).map(c => parseInt(c.getAttribute('data-index'))).sort((a,b) => b-a);
    idxs.forEach(i => inventoryData.splice(i, 1));
    localStorage.setItem("oficina_inventory", JSON.stringify(inventoryData));
    load(); updateRecentes();
}

function toggleAll(source) { document.querySelectorAll(".row-select").forEach(c => c.checked = source.checked); }

const sel = document.getElementById("nome");
tabelaPrecos.forEach(i => sel.innerHTML += `<option value="${i.nome}">${i.nome}</option>`);
load();
updateRecentes();
</script>
</body>
</html>
